services:
  portfolio:
    image: ghcr.io/hartmannlight/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    expose:
      - "4173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`${PORTFOLIO_HOST:?Set PORTFOLIO_HOST}`)"
      - "traefik.http.routers.portfolio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.portfolio.loadbalancer.server.port=4173"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
